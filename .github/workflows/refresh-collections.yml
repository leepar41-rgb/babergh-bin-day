name: Refresh Babergh collections
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch_collections.py"
      - ".github/workflows/refresh-collections.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch council collection dates
        run: python scripts/fetch_collections.py
      - name: Commit verified dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collections.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified Babergh collections"
            git push
          fi
